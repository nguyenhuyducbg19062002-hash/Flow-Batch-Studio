<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Bridge</title>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --ok: #16a34a; --warn: #d97706; --err: #dc2626; --accent: #4f46e5; --accent-soft: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1120; --card: #111827; --text: #e5e7eb; --muted: #94a3b8; --line: #1f2937;
            --ok: #22c55e; --warn: #f59e0b; --err: #f87171; --accent: #818cf8; --accent-soft: #1e1b4b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  h1 { font-size: 15px; margin: 0; }
  .sub { color: var(--muted); font-size: 11px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; }
  .row > span:first-child { color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .pill em { font-style: normal; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .ok .dot { background: var(--ok); } .ok { color: var(--ok); }
  .warn .dot { background: var(--warn); } .warn { color: var(--warn); }
  .err .dot { background: var(--err); } .err { color: var(--err); }
  .run .dot { background: var(--accent); animation: pulse 1.2s infinite; } .run { color: var(--accent); }
  @keyframes pulse { 50% { opacity: .3; } }
  .job-title { font-weight: 600; font-size: 14px; }
  .job-step { margin-top: 4px; padding: 6px 8px; border-radius: 8px; background: var(--accent-soft); color: var(--text); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .hint b { color: var(--text); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  button { font: inherit; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
           color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .stats div { padding: 6px 0; border-radius: 8px; background: var(--bg); }
  .stats b { display: block; font-size: 16px; }
  .stats span { font-size: 11px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow: auto; }
  li { display: grid; grid-template-columns: 52px 1fr; gap: 6px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 12px; }
  li:first-child { border-top: 0; }
  li time { color: var(--muted); font-variant-numeric: tabular-nums; }
  li.ok span { color: var(--ok); } li.error span { color: var(--err); } li.warn span { color: var(--warn); }
  .empty { color: var(--muted); font-size: 12px; }
  .log-head { display: flex; justify-content: space-between; align-items: center; }
  .log-head button { padding: 2px 8px; font-size: 11px; }
</style>
</head>
<body>
  <h1>Flow Batch Studio – Flow Bridge</h1>
  <div class="sub" id="ver"></div>

  <div class="card">
    <h2>Kết nối</h2>
    <div class="row"><span>App Flow Batch Studio</span><span id="app" class="pill"><i class="dot"></i><em>…</em></span></div>
    <div class="row"><span>Tài khoản Google</span><span id="acc" class="pill"><i class="dot"></i><em>…</em></span></div>
    <div class="row"><span>Tab Flow</span><span id="tab" class="pill"><i class="dot"></i><em>…</em></span></div>
    <div class="row"><span>App điều khiển tab</span><span id="ctl" class="pill"><i class="dot"></i><em>…</em></span></div>
    <div id="hint" class="hint"></div>
    <div class="buttons">
      <button id="openFlow" class="primary">Mở tab Flow</button>
      <button id="reconnect">Kết nối lại app</button>
    </div>
  </div>

  <div class="card">
    <h2>Cảnh đang chạy</h2>
    <div id="job"><div class="empty">Không có cảnh nào. Bấm Chạy trong app để bắt đầu.</div></div>
  </div>

  <div class="card">
    <h2>Thống kê</h2>
    <div class="stats">
      <div><b id="done">0</b><span>Cảnh xong</span></div>
      <div><b id="failed">0</b><span>Cảnh lỗi</span></div>
      <div><b id="dl">0</b><span>File tải về</span></div>
    </div>
  </div>

  <div class="card">
    <div class="log-head"><h2>Nhật ký</h2><button id="clear">Xoá</button></div>
    <ul id="log"></ul>
  </div>

  <script src="panel.js"></script>
</body>
</html>
